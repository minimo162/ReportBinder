name: ReportBinder CI

# 変更ごとに回すのは fast-gate だけ。重い受け入れスイートは workflow_dispatch と、
# release.yml が梱包前に走らせる検証に寄せてある。
#
# この配分の理由: 重いスイートは Office の入っていないランナーで動くため、利用者が
# 毎日通る Excel/Word の変換経路をそもそも実行できない(source-adapter が変換を
# 差し替えている)。一方 fast-gate に入っている版番号とCHANGELOGの整合、UI文字列の
# 固定、サーバー実装への assertion は実際に取りこぼしを止めてきた。
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
  # 手動だけにすると、重いスイートを自動で走らせる経路が一つも無くなる
  # (release.yml も workflow_dispatch のみ)。壊れたことに気づくのがリリース直前に
  # なるため、週1で回す。日曜18:00 UTC = 月曜03:00 JST。
  schedule:
    - cron: '0 18 * * 0'

concurrency:
  group: reportbinder-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 変更ごとの門。同梱JREもjarのビルドも要らないので依存導入の段が丸ごと無い。
  fast-gate:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          # 既定の fetch-depth: 1 では基準との差分が取れず、版番号の上げ忘れを見る
          # 門(Assert-RuntimeVersionBumped)が「基準を解決できません」で素通りする。
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check -r .\app\tools\ci-requirements.txt

      - name: Run fast gate
        shell: powershell
        run: .\app\tools\ci-selfcheck.ps1 -Scope Fast

  # 手動実行と週1の定期実行だけ。所要は約10分。
  full-suite:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      # Defender はワークスペースへ書かれたばかりのファイルを走査する。同梱JREとjarは
      # 毎回展開されるため、スイートで最初に起動するJVMがその費用を全部被っていた。
      # 実測では同一ジョブ内で1本目が約65秒、2本目以降が約1.6秒。除外を入れて平す。
      # 失敗してもジョブは続ける(権限が無い環境でも壊さない)。
      - name: Exclude the workspace from realtime scanning
        shell: powershell
        continue-on-error: true
        run: |
          try {
            Add-MpPreference -ExclusionPath '${{ github.workspace }}' -ErrorAction Stop
            Add-MpPreference -ExclusionProcess 'java.exe' -ErrorAction Stop
            Write-Output 'Defender exclusions added.'
          } catch {
            Write-Output "Defender exclusions unavailable: $($_.Exception.Message)"
          }

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check -r .\app\tools\ci-requirements.txt

      - name: Install verified external dependencies
        shell: powershell
        run: .\app\tools\install-thirdparty.ps1 -Force

      - name: Rebuild ReportPdfComposer
        shell: powershell
        run: .\app\lib\pdfbox\build.ps1

      - name: Run complete CI acceptance suite
        shell: powershell
        run: .\app\tools\ci-selfcheck.ps1

      - name: Remove transient dependencies and build output
        if: always()
        shell: powershell
        run: |
          Remove-Item -LiteralPath .\app\thirdparty-cache -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath .\app\lib\pdfbox\classes -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath .\app\tools\__pycache__ -Recurse -Force -ErrorAction SilentlyContinue
