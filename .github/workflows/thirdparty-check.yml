name: Third-party dependency check

on:
  pull_request:
    paths:
      - '.github/apply_ui_fix.py'
      - '.github/workflows/thirdparty-check.yml'

permissions:
  contents: write

jobs:
  apply-history-ui-and-category-filename:
    if: github.head_ref == 'agent/improve-history-and-fix-bod-filename'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out working branch
        uses: actions/checkout@v4
        with:
          ref: agent/improve-history-and-fix-bod-filename
          fetch-depth: 0

      - name: Apply product fixes
        shell: powershell
        run: |
          py -3 .github\apply_ui_fix.py

      - name: Validate PowerShell and repository checks
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path .\app\server.ps1), [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }
          py -3 .\app\tools\selfcheck.py

      - name: Commit validated product changes
        shell: powershell
        run: |
          git checkout origin/main -- .github/workflows/thirdparty-check.yml
          Remove-Item -LiteralPath .github/apply_ui_fix.py -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Improve history navigation and category filenames"
          git push origin HEAD:agent/improve-history-and-fix-bod-filename
