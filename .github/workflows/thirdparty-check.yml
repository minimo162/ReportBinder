name: Third-party dependency check

on:
  pull_request:
    paths:
      - 'app/tools/install-thirdparty.ps1'
      - 'app/tools/verify-thirdparty.ps1'
      - 'app/tools/package-release.ps1'
      - 'app/lib/pdfbox/**'
      - 'app/web/pdfjs/**'
      - 'docs/THIRD_PARTY_SETUP.md'
      - 'THIRD_PARTY_NOTICES.md'
      - '.github/workflows/thirdparty-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-on-windows-powershell-51:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install and verify all external dependencies
        shell: powershell
        run: |
          $PSVersionTable.PSVersion
          .\app\tools\install-thirdparty.ps1 -Force
          .\app\tools\verify-thirdparty.ps1 -RequirePdfJs -RequirePortableJava

      - name: Rebuild ReportPdfComposer against downloaded PDFBox
        shell: powershell
        run: |
          .\app\lib\pdfbox\build.ps1

      - name: Run repository self-check
        shell: powershell
        run: |
          py -3 .\app\tools\selfcheck.py
